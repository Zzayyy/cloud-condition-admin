server:
  # 与前端 Vite 代理的 VITE_API_BASE_URL=/api 对齐：前端发 /api/system/users，
  # 这里如果不再加 /api 前缀就会 404。context-path 让 Controller 里只写 /system/users。
  port: 8000
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
  # 管理端在 Nginx 之后，务必让容器/网关如实回传真实 IP，否则审计里的 IP 全是网关地址
  forward-headers-strategy: framework

spring:
  application:
    name: cloud-condition-admin-backend

  datasource:
    url: jdbc:mysql://192.168.1.136:3306/qianlong_cloud?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: qianlong_cloud
    # 注意：MySQL 是小写 l 的 Qianlong@2026（无 &），
    # 与下面 app.redis.instances 的 Redis 密码 QianLong@2026& 只差大小写和一个 &。
    password: Qianlong@2026
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: adminHikari
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 10000
      # 注意：库里 T_UserLog 有 19 万行、T_StrategyLog 1.6 万行。
      # 本模块只查 T_Admin* 表，但将来接业务表页面时这些超时必须留着。
      max-lifetime: 1200000

  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai

  threads:
    virtual:
      # JDK 21 虚拟线程：后台管理是 IO 密集（查库为主），虚拟线程能显著提高并发下的吞吐，
      # 且不需要调线程池参数。本项目没有 ThreadLocal 依赖（Sa-Token 用 SaStorage 抽象）。
      enabled: true

mybatis-plus:
  configuration:
    # ⚠️ 这两个开关必须同时关掉，原因见 README「踩坑记录」：
    # 本模块的表沿用了前端的驼峰列名（lastLoginIP / loginIP / permissionKey ...），
    # 而 MyBatis-Plus 默认会把驼峰字段名转成下划线列名 ——
    #   lastLoginIP → last_login_i_p  ← 连续大写会被逐字符拆开，生成一个不存在的列
    # 关掉 table-underline 后，字段名即列名，与 DDL 严格一致，不存在猜测。
    map-underscore-to-camel-case: false
    # 打印慢 SQL 便于运维排查；开发期可改成 StdOutImpl 看完整语句
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      table-underline: false
      id-type: auto
      logic-delete-field: null

sa-token:
  # token 名称：前端 axios 拦截器固定发 Authorization: Bearer <token>
  token-name: Authorization
  # token 前缀：与前端 `Bearer ${token}` 对应
  token-prefix: Bearer
  # 有效期 8 小时（管理端一个工作日），-1 表示永不过期（这里不采用）
  timeout: 28800
  # 最低活跃频率 -1：不做「多久没操作就失效」，避免运维开着页面看行情时被踢
  active-timeout: -1
  # 允许同一账号多端登录（运维常在跳板机与本地同时开）
  is-concurrent: true
  # 多端登录时共用一个 token（便于停用时一次性踢掉全部会话）
  is-share: true
  # 从请求头读取（不用 cookie：前后端分离，且避免 CSRF）
  is-read-cookie: false
  is-read-header: true
  token-style: uuid
  # 关闭控制台 banner，日志干净些
  is-print: false

# =============================================================================
# Redis 实例清单（账户与用户页要读 acc-* 键）
# -----------------------------------------------------------------------------
# 现场是**多实例 + 多 db**，且 acc-* 分散在其中（实测 2026-10-12）：
#   192.168.1.136 db0  1 个 acc-*      （就是 T_User 里那唯一一行账号）
#   192.168.1.136 db1  12 个 acc-*
#   192.168.1.137 db1  1 个 acc-*
# 所以这里用**列表**而不是单 host —— Spring 的 spring.data.redis.* 只支持
# 一个连接，表达不了这种结构，故本模块不用它的自动配置，见 RedisAccountRepository。
#
# ⚠️ 密码与 MySQL 的**不一样**，且大小写很容易看错：
#    Redis   = QianLong@2026&   ← 注意是大写 L，且**末尾有个 &**
#    MySQL   = Qianlong@2026    ← 小写 l，无 &
#    两个密码只差一个字母大小写与一个 & 符号，肉眼极易混淆。
#    我第一版就写成了 Qianlong@2026&（小写 l），
#    表现为「三个实例全部连接失败」，而这时接口**不会报错**，
#    只会让所有账号的 hasRedis 变成 false —— 很容易被误读成
#    「这些账号在 Redis 里确实没有实时对象」。密码取自现场工具的
#    strategy_test/config.ini（pwd）与 datahub_test/config.ini（r_pwd），两处一致。
#    生产环境请改用环境变量注入，不要把密码提交进仓库。
# =============================================================================
app:
  redis:
    # 单次 SCAN 的游标批次；acc-* 数量很少，这里只是防止误扫全库
    scan-count: 500
    # 命令超时（毫秒）。Redis 不可达时页面应尽快降级提示，而不是把接口挂住
    timeout-ms: 3000
    instances:
      - id: '136-0'
        host: 192.168.1.136
        port: 6379
        db: 0
        password: QianLong@2026&
      - id: '136-1'
        host: 192.168.1.136
        port: 6379
        db: 1
        password: QianLong@2026&
      - id: '137-1'
        host: 192.168.1.137
        port: 6379
        db: 1
        password: QianLong@2026&

  # ===========================================================================
  # 委托服务器（WT 方向）—— 只读状态，不做启停
  # ---------------------------------------------------------------------------
  # 注册表键 `traderserver` 也是**跨实例各存一份**，且各份内容不同（实测 2026-10-14）：
  #   192.168.1.136 db0  2 条   （我们自己的测试插件残留）
  #   192.168.1.136 db1  7 条   ← 只有 id=1 那条每 10 秒刷新（活的委托服务器在 137）
  #   192.168.1.137 db1  4 条   （全部 63 天前）
  #   192.168.1.137 db0  无此键（该库只有 1412 万条的 ST-* 流，不要去扫）
  # 所以必须**跨实例全读**：只读一个库会漏节点；按 id 去重又会把现场真实存在的
  # 重复记录（136 db1 里有 4 个 id=0）藏起来。重不重复由页面呈现，后端不悄悄合并。
  #
  # registry-instances 留空 = 读上面 app.redis.instances 里的全部实例。
  # 将来加一台委托服务器，只要它的 (host, db) 在那份清单里，这里不用改。
  # ===========================================================================
  trade:
    # 心跳阈值（秒）。⚠️ 必须与前端 SERVER_OFFLINE_AFTER_SEC 一致，
    # 否则会出现「页面显示 1 台在线、汇总卡说 0 台」这种没法解释的偏差。
    offline-after-sec: 30
    registry-key: traderserver
    registry-instances: []
    channels:
      # ⚠️ 现场实测带 _1 后缀（REDISSELECT=1），不带后缀的那一套并不存在。
      # 实际频道名 = <名字> + suffix。
      online: tradeserver_online
      beat: tradeserver_beat
      offline: tradeserver_offline
      suffix: '_1'

  # ===========================================================================
  # 数据中台（DataHub）—— 只读
  # ---------------------------------------------------------------------------
  # ⚠️ 中台**没有节点清单键**。委托服务器有 `traderserver`（里面写着 id/ip/mac），
  #    中台翻遍 136/137 只有 DataHub_req_stream / DataHub_reply_stream / unique_id，
  #    没有任何注册表 —— 所以「节点」只能按 **Redis 实例**来分。
  #
  # ⚠️ 心跳报文**不含身份**（实测 2026-10-14）：
  #      DataHub 心跳 = {"level":2,"role":1}        ← 没有 id / ip / mac
  #      委托服务器心跳 = {"id":1,"unique_string":"WT-...","ip":"...","mac":"..."}
  #    所以**不能**说「136 这台机器上有中台」；能说的只有
  #    「136 这台 Redis 上最近有中台在通信」。
  #    `level` / `role` 语义未在协议文档中定义，且一台机器只能观察到一个取值，
  #    **绝不可当作节点 ID 使用**（多中台同时发同一 role 时会造成静默串行/漏行）。
  #
  # 在线判定 = 该 Redis 实例上是否在 datahub_beat_1 收到过心跳。
  # 因此需要在每台实例上**常驻一条订阅连接** —— 注意这个开销与「有几个中台」无关，
  # 只与「有几台 Redis」有关（Pub/Sub 不按 db 隔离，一台实例一条即可）。
  #
  # ⚠️ 订阅会**改变频道列表本身**：PUBSUB CHANNELS 只列「有订阅者的频道」，
  #    我们一订阅，datahub_beat_1 就从「不存在」变成「存在」。
  #    所以频道接口会把「我们自己这一份订阅」从订阅者数里扣掉并标注出来，
  #    否则页面上的订阅者数会始终比真实多 1，甚至凭空多出一个频道。
  # ===========================================================================
  datahub:
    # 心跳超时（秒）：超过这个时间没在实例上收到心跳即视为离线。
    # 现场心跳间隔约 10 秒，30 秒 = 容忍连丢 2 次。
    offline-after-sec: 30
    # 要统计的 db 上限（**含**该值）。现场最多用到 db2；Redis 默认 16 个库（db0~db15）。
    # ⚠️ 不要写成 16 —— db16 不存在，建立连接会报 "ERR DB index is out of range"，
    #    而且该失败会在**每次请求**时重试，日志里刷满同样的告警。
    max-db: 15
    # 单次统计时每个 db 最多扫多少个键（XLEN 要逐键查，必须有上限）
    scan-limit: 2000
    heartbeat:
      # 常驻订阅开关。关掉后页面会如实显示「未知」，而不是假装在线/离线
      enabled: true
      # 用于判定的频道名。
      # ⚠️ 这里**只写实际在用的那一个**（先用实测确认，见下方的更正记录）。
      #    早先为了「防后缀写错」同时订阅了带后缀与不带后缀两种拼法，
      #    结果**凭空造出了 datahub_beat（无后缀）这个频道** ——
      #    Redis 的 PUBSUB CHANNELS 只列「有订阅者的频道」，
      #    我们一订阅，那个频道就出现了，连 Redis 管理页都会看到它。
      #    这属于「观测行为改变了被观测对象」，必须避免。
      #    后缀写错的代价是状态显示为「未知」（诚实），而不是造出一个假频道。
      channels:
        # 🔴 2026-10-23 实测更正：中台发的是 **不带 _1** 的这个。
        #    同时订阅两个候选名各 20 秒：
        #      datahub_beat_1 → 0 条
        #      datahub_beat   → 2 条，内容 {"level":2,"role":1}
        #    20 秒 2 条 = 每 10 秒一次，与本文件记的心跳间隔完全吻合。
        #    此前写的是 datahub_beat_1（当时判断"现场带 _1 后缀"），
        #    导致页面长期显示「2 个实例状态未知」—— 判定逻辑没错，
        #    是**我们在听一个没人在发的频道**。
        - datahub_beat

  # ===========================================================================
  # 策略服务器（ST 方向）—— 只读，**不做启停**
  # ---------------------------------------------------------------------------
  # 注册表键 `strategy-srv` 与委托服务器的 `traderserver` **结构相同**：
  #   { "strategy-srv": [ { id, ip, mac, usecount, enable,
  #                         "login-time", "last-active-time", lastActiveTimeLong } ] }
  # 同样**跨实例各存一份且内容不同**（实测 2026-10-15）：
  #   192.168.1.136 db0  1 条  mac=2cea7fd9d5c0QLDataHub1  最后活跃 今天 10:01
  #   192.168.1.136 db1  1 条  mac=2cea7fd9d5c0probe       停在 9/24（21 天前）
  #   192.168.1.137 db1  无此键
  #
  # ⚠️ 现场现状：**策略服务器未开放**，所以
  #    1) 注册表不刷新（盯 30 秒内容完全不变）；
  #    2) `strategyserver_beat_1` 频道上没有心跳（订阅 25 秒 0 条）。
  #    → 心跳收不到是**预期现象，不是故障**，因此本模块**不加常驻订阅**
  #      （加了也收不到，还会因 PUBSUB CHANNELS 只列有订阅者的频道
  #        而凭空「造出」频道订阅者，污染 Redis 管理页）。
  #    → 「在线」只能按 lastActiveTimeLong 判，结果必然接近 0 台；
  #      页面会额外显示「注册表已 N 秒未刷新」把这件事说清楚，
  #      否则 21 天前的时间戳会被读成「策略平台全挂了」。
  # ===========================================================================
  strategy:
    # 心跳阈值（秒）。⚠️ 必须与前端 SERVER_OFFLINE_AFTER_SEC 一致。
    offline-after-sec: 30
    registry-key: strategy-srv
    # 注册表「多久没变就算陈旧」（秒）。超过后页面提示注册表未刷新 ——
    # 用来区分「节点都离线」与「这个注册表本身就没在更新」。
    stale-registry-after-sec: 120

  # ===========================================================================
  # 条件单状态变更（停止 / 运行 / 终止）—— 高危，默认**全关**
  # ---------------------------------------------------------------------------
  # ⭐ 语义（需求方 2026-10-21 明确）：
  #     改本地（Redis strategy-* + MySQL T_Conditional）—— **必做的主路径**
  #     下发 setByStrategy 通知策略平台 —— **附加动作**，有编号就发、没有就跳过
  #    原话：「不管是否连上对应的策略服务器，只要后台发了改状态的申请就要改状态
  #           （REDIS+MYSQL）」「只是如果连上策略服务器还要顺带通知一下」
  #    所以 strategyServerID=-1（账号未连策略服务器）不是错误，结果是 local_only。
  #
  # ⚠️ 但总开关默认关：改错了会直接影响客户正在运行的条件单。
  #      enabled=false              → 一个字节都不写
  #      allowed-server-ids: []    → **一律不下发**（本地改照做）
  #      allow-live-platform=false → 目标流上坐着真平台时不下发（本地改照做）
  #
  # 协议（2026-10-21 现场实测样本，不是照文档抄的）：
  #   请求 {"setByStrategy":{"Unique_Account":"010100011300_7_6","Mode":2,"Refs":["2026..."]}}
  #   回执 {"Err":0,"Msg":"set conditional mode success","Results":[{"Ref":"...","Mode":2}]}
  #     —— 回执在 ST-<编号>-reply，**不在** DataHub_reply_stream
  #        （那里是中台的解析失败，是**假失败**）
  #
  # ⚠️ 不提供新增与删除：需求方明确「不允许删除，只允许停止、终止等状态操作」。
  # ===========================================================================
  conditional:
    # 写操作总开关。
    #
    # ⚠️ 当前是 true —— 这是**联调态**（页面上要能点得动）。
    #    交付/上生产前必须改回 false，或者改用 profile 隔离：
    #      application.yml         enabled: false   ← 安全基线
    #      application-local.yml   enabled: true    ← 本地联调
    #    代码里的默认值仍是 false（见 ConditionalWriteProperties.enabled），
    #    所以**不写这一项就是关的** —— 安全基线不依赖这个文件。
    #
    # 开之前请先确认下面两项配好了。
    enabled: true
    # 目标 Redis 实例（真策略平台所在的那个库：现场是 192.168.1.136 db0）
    instance-id: 136-0
    # 等回执的超时（毫秒）。超时 = 「已下发但结果未知」，不是失败
    reply-timeout-ms: 10000
    # 允许下发到的策略服务器编号白名单。**为空 = 全部拒绝**。
    # ⚠️ 现场 Redis 里条件单的 strategyServerID 全是 -1（尚未分配），
    #    acc-* 的 strategyserverid 也是 -1/0 —— 也就是说"这条单该发给哪台
    #    策略平台"这个映射在现场并不存在，必须由运维显式指定。
    allowed-server-ids: []
    # 目标流上坐着真策略平台时是否仍然下发（默认否）。
    # 判据：XINFO CONSUMERS 里存在「消费者名 = 流名本身」的消费者。
    allow-live-platform: false
    # 下发流名模板与回执流后缀
    stream-prefix: 'ST-'
    reply-suffix: '-reply'
    # 入口流名（客户端 → 数据中台）与其 server_type
    request-stream: DataHub_req_stream
    server-type: ST

logging:
  level:
    root: INFO
    com.qianlong.cloud.admin: DEBUG
    # 打开后可看到每次权限校验查库的 SQL
    com.qianlong.cloud.admin.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
