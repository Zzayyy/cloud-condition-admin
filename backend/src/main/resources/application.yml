server:
  # 与前端 Vite 代理的 VITE_API_BASE_URL=/api 对齐：前端发 /api/system/users，
  # 这里如果不再加 /api 前缀就会 404。context-path 让 Controller 里只写 /system/users。
  port: 8000
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
  # 管理端在 Nginx 之后，务必让容器/网关如实回传真实 IP，否则审计里的 IP 全是网关地址
  forward-headers-strategy: framework

spring:
  application:
    name: cloud-condition-admin-backend

  datasource:
    url: jdbc:mysql://192.168.1.136:3306/qianlong_cloud?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: qianlong_cloud
    # 注意：MySQL 是小写 l 的 Qianlong@2026（无 &），
    # 与下面 app.redis.instances 的 Redis 密码 QianLong@2026& 只差大小写和一个 &。
    password: Qianlong@2026
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: adminHikari
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 10000
      # 注意：库里 T_UserLog 有 19 万行、T_StrategyLog 1.6 万行。
      # 本模块只查 T_Admin* 表，但将来接业务表页面时这些超时必须留着。
      max-lifetime: 1200000

  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai

  threads:
    virtual:
      # JDK 21 虚拟线程：后台管理是 IO 密集（查库为主），虚拟线程能显著提高并发下的吞吐，
      # 且不需要调线程池参数。本项目没有 ThreadLocal 依赖（Sa-Token 用 SaStorage 抽象）。
      enabled: true

mybatis-plus:
  configuration:
    # ⚠️ 这两个开关必须同时关掉，原因见 README「踩坑记录」：
    # 本模块的表沿用了前端的驼峰列名（lastLoginIP / loginIP / permissionKey ...），
    # 而 MyBatis-Plus 默认会把驼峰字段名转成下划线列名 ——
    #   lastLoginIP → last_login_i_p  ← 连续大写会被逐字符拆开，生成一个不存在的列
    # 关掉 table-underline 后，字段名即列名，与 DDL 严格一致，不存在猜测。
    map-underscore-to-camel-case: false
    # 打印慢 SQL 便于运维排查；开发期可改成 StdOutImpl 看完整语句
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      table-underline: false
      id-type: auto
      logic-delete-field: null

sa-token:
  # token 名称：前端 axios 拦截器固定发 Authorization: Bearer <token>
  token-name: Authorization
  # token 前缀：与前端 `Bearer ${token}` 对应
  token-prefix: Bearer
  # 有效期 8 小时（管理端一个工作日），-1 表示永不过期（这里不采用）
  timeout: 28800
  # 最低活跃频率 -1：不做「多久没操作就失效」，避免运维开着页面看行情时被踢
  active-timeout: -1
  # 允许同一账号多端登录（运维常在跳板机与本地同时开）
  is-concurrent: true
  # 多端登录时共用一个 token（便于停用时一次性踢掉全部会话）
  is-share: true
  # 从请求头读取（不用 cookie：前后端分离，且避免 CSRF）
  is-read-cookie: false
  is-read-header: true
  token-style: uuid
  # 关闭控制台 banner，日志干净些
  is-print: false

# =============================================================================
# Redis 实例清单（账户与用户页要读 acc-* 键）
# -----------------------------------------------------------------------------
# 现场是**多实例 + 多 db**，且 acc-* 分散在其中（实测 2026-10-12）：
#   192.168.1.136 db0  1 个 acc-*      （就是 T_User 里那唯一一行账号）
#   192.168.1.136 db1  12 个 acc-*
#   192.168.1.137 db1  1 个 acc-*
# 所以这里用**列表**而不是单 host —— Spring 的 spring.data.redis.* 只支持
# 一个连接，表达不了这种结构，故本模块不用它的自动配置，见 RedisAccountRepository。
#
# ⚠️ 密码与 MySQL 的**不一样**，且大小写很容易看错：
#    Redis   = QianLong@2026&   ← 注意是大写 L，且**末尾有个 &**
#    MySQL   = Qianlong@2026    ← 小写 l，无 &
#    两个密码只差一个字母大小写与一个 & 符号，肉眼极易混淆。
#    我第一版就写成了 Qianlong@2026&（小写 l），
#    表现为「三个实例全部连接失败」，而这时接口**不会报错**，
#    只会让所有账号的 hasRedis 变成 false —— 很容易被误读成
#    「这些账号在 Redis 里确实没有实时对象」。密码取自现场工具的
#    strategy_test/config.ini（pwd）与 datahub_test/config.ini（r_pwd），两处一致。
#    生产环境请改用环境变量注入，不要把密码提交进仓库。
# =============================================================================
app:
  redis:
    # 单次 SCAN 的游标批次；acc-* 数量很少，这里只是防止误扫全库
    scan-count: 500
    # 命令超时（毫秒）。Redis 不可达时页面应尽快降级提示，而不是把接口挂住
    timeout-ms: 3000
    instances:
      - id: '136-0'
        host: 192.168.1.136
        port: 6379
        db: 0
        password: QianLong@2026&
      - id: '136-1'
        host: 192.168.1.136
        port: 6379
        db: 1
        password: QianLong@2026&
      - id: '137-1'
        host: 192.168.1.137
        port: 6379
        db: 1
        password: QianLong@2026&

logging:
  level:
    root: INFO
    com.qianlong.cloud.admin: DEBUG
    # 打开后可看到每次权限校验查库的 SQL
    com.qianlong.cloud.admin.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
